<svg xmlns="http://www.w3.org/2000/svg" width="960" height="810" viewBox="0 0 960 810" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Как работает BooHarness</title>
<desc id="desc">Claude в приложении Claude Code руководит работой. orch выбирает семейства по темпу квоты. Исполнители возвращают JSON-отчёты; необязательная оценка Jev и проверка другим семейством предшествуют проверке перед коммитом лида. Память хранит уроки, задачи и передачу дел. Редактирующие роли получают отдельные worktree, роли только для чтения — нет.</desc>
<style>:root{--paper:#ffffff;--panel:#f6f8fa;--ink:#1f2328;--muted:#57606a;--line:#8c959f;--blue:#0969da;--blue-soft:#ddf4ff;--gold:#9a6700;--gold-soft:#fff8c5;--green:#1a7f37;--green-soft:#dafbe1} @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#9198a1;--line:#6e7681;--blue:#58a6ff;--blue-soft:#0c2d4a;--gold:#d29922;--gold-soft:#2e2a12;--green:#3fb950;--green-soft:#12261e}}
.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--line)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.blue{fill:var(--blue)}.route{fill:none;stroke:var(--blue);stroke-width:2}.rule{fill:none;stroke:var(--line);stroke-width:1}.h{font-size:24px;font-weight:600;fill:var(--ink)}.body{font-size:17px;fill:var(--ink)}.small{font-size:16px;fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.num{font-size:16px;font-weight:600;fill:var(--blue)}.gold-box{fill:var(--gold-soft);stroke:var(--gold);stroke-dasharray:6 5}.green-box{fill:var(--green-soft);stroke:var(--green)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" class="blue"/></marker></defs>
<rect width="960" height="810" class="paper"/>
<text x="36" y="50" class="h" >Как движется работа</text><rect x="36" y="90" width="216" height="222" rx="10" class="panel"/><text x="54" y="118" class="num" >01</text><text x="54" y="151" class="h" >Claude · лид</text><text x="54" y="181" class="body" >Приложение</text>
<text x="54" y="205" class="body" >Claude Code</text>
<text x="54" y="229" class="body" >План и задания</text>
<text x="54" y="253" class="body" >Оценка фактов</text><rect x="300" y="90" width="264" height="222" rx="10" class="panel"/><text x="318" y="118" class="num" >02</text><text x="318" y="151" class="h" >Служба orch</text><text x="318" y="181" class="body" >Выбирает семейство</text>
<text x="318" y="205" class="body" >по темпу расхода квоты</text>
<text x="318" y="229" class="body" >Запускает исполнителя</text>
<text x="318" y="253" class="body" >Уроки в первом сообщении</text><rect x="612" y="90" width="312" height="222" rx="10" class="panel"/><text x="630" y="118" class="num" >03</text><text x="630" y="151" class="h" >Исполнители</text><text x="630" y="181" class="small" >Pi · Claude Code также нативно</text><path d="M631 199V282" class="route"/><path d="M631 205H653" class="route"/><text x="660" y="210" class="body mono" >coder</text><text x="795" y="210" class="small mono" >git worktree</text><path d="M631 235H653" class="route"/><text x="660" y="240" class="body mono" >reviewer</text><text x="795" y="240" class="small mono" >git worktree</text><path d="M631 265H653" class="route"/><text x="660" y="270" class="body mono" >bughunter</text><text x="795" y="270" class="small mono" >git worktree</text><path d="M252 198H298" class="route" marker-end="url(#arrow)"/><path d="M564 198H610" class="route" marker-end="url(#arrow)"/><path d="M768 312V348H135V388" class="route" marker-end="url(#arrow)"/><text x="450" y="339" class="small" text-anchor="middle">Каждый исполнитель возвращает факты через orch</text><rect x="36" y="390" width="198" height="190" rx="10" class="panel"/><text x="54" y="418" class="num" >04</text><text x="54" y="452" class="h" >JSON-отчёт</text><text x="54" y="484" class="body" >Выводы, проверки,</text>
<text x="54" y="508" class="body" >изменённые файлы,</text>
<text x="54" y="532" class="body" >что не проверено</text><rect x="266" y="390" width="198" height="190" rx="10" class="gold-box"/><text x="284" y="418" class="num" >05</text><text x="284" y="452" class="h" >Оценка Jev</text><text x="284" y="484" class="body" >Судья по желанию</text>
<text x="284" y="508" class="body" >Платная оценка</text>
<text x="284" y="532" class="body" >Объём задания и</text>
<text x="284" y="556" class="body" >число рецензентов</text><rect x="496" y="390" width="198" height="190" rx="10" class="panel"/><text x="514" y="418" class="num" >06</text><text x="514" y="452" class="h" >Проверка</text><text x="514" y="480" class="body" >Другое семейство</text>
<text x="514" y="500" class="body" >Один; двое — если</text>
<text x="514" y="520" class="body" >безопасность / Jev</text>
<text x="514" y="540" class="body" >Блокер нужно</text>
<text x="514" y="560" class="body" >воспроизвести</text><rect x="726" y="390" width="198" height="190" rx="10" class="green-box"/><text x="744" y="418" class="num" >07</text><text x="744" y="452" class="h" >Коммит</text><text x="744" y="484" class="body" >Лид делает коммит</text>
<text x="744" y="508" class="body" >с явными путями</text><text x="744" y="544" class="body mono" >check:commit</text><path d="M234 476H264" class="route" marker-end="url(#arrow)"/><path d="M464 476H494" class="route" marker-end="url(#arrow)"/><path d="M694 476H724" class="route" marker-end="url(#arrow)"/><path d="M135 580V608H595V582" class="route" marker-end="url(#arrow)"/><text x="365" y="602" class="small" text-anchor="middle">Без Jev: отчёт → проверка</text><rect x="36" y="638" width="888" height="144" rx="10" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="54" y="670" class="h" >Память</text><text x="54" y="700" class="body" >Уроки · задачи · передача дел · решения</text><text x="54" y="730" class="small" >Лид ищет перед работой; каждый исполнитель получает уроки по своим файлам.</text>
<text x="54" y="754" class="small" >Роли только для чтения (например, scout) не получают отдельный worktree.</text><path d="M924 229H942V710H924" class="rule"/><path d="M36 229H18V710H36" class="rule"/>
</svg>
