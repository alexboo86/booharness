<svg xmlns="http://www.w3.org/2000/svg" width="960" height="632" viewBox="0 0 960 632" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Установка BooHarness одним промптом</title>
<desc id="desc">Вставьте один промпт в приложение Claude Code. Агент клонирует репозиторий GitHub, следует INSTALL.md, открывает вход в семейства по одному и запускает doctor. Пользователь входит сам; секреты не попадают в чат.</desc>
<style>:root{--paper:#ffffff;--panel:#f6f8fa;--ink:#1f2328;--muted:#57606a;--line:#8c959f;--blue:#0969da;--blue-soft:#ddf4ff;--gold:#9a6700;--gold-soft:#fff8c5;--green:#1a7f37;--green-soft:#dafbe1} @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#9198a1;--line:#6e7681;--blue:#58a6ff;--blue-soft:#0c2d4a;--gold:#d29922;--gold-soft:#2e2a12;--green:#3fb950;--green-soft:#12261e}}
.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--line)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.blue{fill:var(--blue)}.route{fill:none;stroke:var(--blue);stroke-width:2}.rule{fill:none;stroke:var(--line);stroke-width:1}.h{font-size:24px;font-weight:600;fill:var(--ink)}.body{font-size:17px;fill:var(--ink)}.small{font-size:16px;fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.num{font-size:16px;font-weight:600;fill:var(--blue)}.gold-box{fill:var(--gold-soft);stroke:var(--gold);stroke-dasharray:6 5}.green-box{fill:var(--green-soft);stroke:var(--green)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" class="blue"/></marker></defs>
<rect width="960" height="632" class="paper"/>
<text x="36" y="50" class="h" >Один промпт. Дальше действует агент.</text><rect x="36" y="86" width="888" height="118" rx="10" class="panel"/><text x="54" y="116" class="num" >01</text><text x="105" y="123" class="h" >Приложение Claude Code</text><text x="105" y="155" class="body" >Вставьте промпт установки в сессию с доступом к локальному терминалу.</text><text x="105" y="182" class="small" >Эта сессия остаётся вашим лидом.</text><path d="M480 204V246H135V274" class="route" marker-end="url(#arrow)"/><rect x="36" y="276" width="198" height="196" rx="10" class="panel"/><text x="54" y="307" class="num" >02</text><text x="54" y="344" class="h" >Клонировать</text><text x="54" y="379" class="body" >Агент клонирует</text>
<text x="54" y="403" class="body" >репозиторий</text>
<text x="54" y="427" class="body" >GitHub.</text><path d="M234 369H264" class="route" marker-end="url(#arrow)"/><rect x="266" y="276" width="198" height="196" rx="10" class="panel"/><text x="284" y="307" class="num" >03</text><text x="284" y="344" class="h" >Установить</text><text x="284" y="379" class="body" >Читает INSTALL.md</text>
<text x="284" y="403" class="body" >целиком и следует</text>
<text x="284" y="427" class="body" >каждому этапу.</text><path d="M464 369H494" class="route" marker-end="url(#arrow)"/><rect x="496" y="276" width="198" height="196" rx="10" class="panel"/><text x="514" y="307" class="num" >04</text><text x="514" y="344" class="h" >Войти</text><text x="514" y="379" class="body" >Открывает вход</text>
<text x="514" y="403" class="body" >в семейства</text>
<text x="514" y="427" class="body" >по одному.</text>
<text x="514" y="451" class="body" >Вы входите сами.</text><path d="M694 369H724" class="route" marker-end="url(#arrow)"/><rect x="726" y="276" width="198" height="196" rx="10" class="green-box"/><text x="744" y="307" class="num" >05</text><text x="744" y="344" class="h" >Проверить</text><text x="744" y="379" class="body" >Запускает doctor.</text>
<text x="744" y="403" class="body" >Показывает сбои</text>
<text x="744" y="427" class="body" >и следующий шаг.</text><path d="M36 508H924" class="rule"/><text x="36" y="539" class="h" >Вход остаётся за вами.</text><text x="36" y="569" class="body" >Агент открывает браузер или окно для ключа. Секреты нельзя отправлять в чат.</text><text x="36" y="603" class="small" >Doctor сообщает: ok · fault + следующий шаг · not checked + причина</text>
</svg>
