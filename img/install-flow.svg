<svg xmlns="http://www.w3.org/2000/svg" width="960" height="632" viewBox="0 0 960 632" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Install BooHarness with one prompt</title>
<desc id="desc">Paste one prompt into the Claude Code desktop app. The agent clones the GitHub repository, follows INSTALL.md, opens family logins one at a time, then runs doctor. The user signs in; secrets never go in chat.</desc>
<style>:root{--paper:#ffffff;--panel:#f6f8fa;--ink:#1f2328;--muted:#57606a;--line:#8c959f;--blue:#0969da;--blue-soft:#ddf4ff;--gold:#9a6700;--gold-soft:#fff8c5;--green:#1a7f37;--green-soft:#dafbe1} @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#9198a1;--line:#6e7681;--blue:#58a6ff;--blue-soft:#0c2d4a;--gold:#d29922;--gold-soft:#2e2a12;--green:#3fb950;--green-soft:#12261e}}
.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--line)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.blue{fill:var(--blue)}.route{fill:none;stroke:var(--blue);stroke-width:2}.rule{fill:none;stroke:var(--line);stroke-width:1}.h{font-size:24px;font-weight:600;fill:var(--ink)}.body{font-size:17px;fill:var(--ink)}.small{font-size:16px;fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.num{font-size:16px;font-weight:600;fill:var(--blue)}.gold-box{fill:var(--gold-soft);stroke:var(--gold);stroke-dasharray:6 5}.green-box{fill:var(--green-soft);stroke:var(--green)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" class="blue"/></marker></defs>
<rect width="960" height="632" class="paper"/>
<text x="36" y="50" class="h" >One prompt. The agent takes it from there.</text><rect x="36" y="86" width="888" height="118" rx="10" class="panel"/><text x="54" y="116" class="num" >01</text><text x="105" y="123" class="h" >Claude Code desktop app</text><text x="105" y="155" class="body" >Paste the install prompt into a session with local terminal access.</text><text x="105" y="182" class="small" >Keep this session as your lead.</text><path d="M480 204V246H135V274" class="route" marker-end="url(#arrow)"/><rect x="36" y="276" width="198" height="196" rx="10" class="panel"/><text x="54" y="307" class="num" >02</text><text x="54" y="344" class="h" >Clone</text><text x="54" y="379" class="body" >The agent clones</text>
<text x="54" y="403" class="body" >the GitHub</text>
<text x="54" y="427" class="body" >repository.</text><path d="M234 369H264" class="route" marker-end="url(#arrow)"/><rect x="266" y="276" width="198" height="196" rx="10" class="panel"/><text x="284" y="307" class="num" >03</text><text x="284" y="344" class="h" >Follow</text><text x="284" y="379" class="body" >Reads INSTALL.md</text>
<text x="284" y="403" class="body" >in full and follows</text>
<text x="284" y="427" class="body" >each phase.</text><path d="M464 369H494" class="route" marker-end="url(#arrow)"/><rect x="496" y="276" width="198" height="196" rx="10" class="panel"/><text x="514" y="307" class="num" >04</text><text x="514" y="344" class="h" >Sign in</text><text x="514" y="379" class="body" >Opens family logins,</text>
<text x="514" y="403" class="body" >one at a time.</text>
<text x="514" y="427" class="body" >You sign in.</text><path d="M694 369H724" class="route" marker-end="url(#arrow)"/><rect x="726" y="276" width="198" height="196" rx="10" class="green-box"/><text x="744" y="307" class="num" >05</text><text x="744" y="344" class="h" >Verify</text><text x="744" y="379" class="body" >Runs doctor.</text>
<text x="744" y="403" class="body" >Shows faults and</text>
<text x="744" y="427" class="body" >what to do next.</text><path d="M36 508H924" class="rule"/><text x="36" y="539" class="h" >Sign-in stays with you.</text><text x="36" y="569" class="body" >The agent opens the browser or key window. Never paste a secret into chat.</text><text x="36" y="603" class="small" >Doctor reports: ok · fault + next step · not checked + reason</text>
</svg>
