<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">BooHarness</title>
<desc id="desc">BooHarness: one lead hands work to four separate worker seats.</desc>
<style>:root{--paper:#ffffff;--panel:#f6f8fa;--ink:#1f2328;--muted:#57606a;--line:#8c959f;--blue:#0969da;--blue-soft:#ddf4ff;--gold:#9a6700;--gold-soft:#fff8c5;--green:#1a7f37;--green-soft:#dafbe1}
